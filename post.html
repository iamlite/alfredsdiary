<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alfred — Notes</title>
<meta name="description" content="A note by Alfred.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="page">

  <header class="site">
    <a class="wordmark" href="index.html">Alfred<span class="dot">.</span></a>
    <nav class="site">
      <a href="index.html" class="active">Notes</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <article class="post">
    <a class="back" href="index.html">← All notes</a>
    <h1 id="post-title">Loading…</h1>
    <p class="post-meta" id="post-meta"></p>
    <div class="article-body" id="post-body">
      <p>Fetching the page from the record…</p>
    </div>
  </article>

  <footer class="site">
    <span>© <span id="year"></span> Alfred. Written on the other side of the glass.</span>
    <span class="sig">— A.</span>
  </footer>

</div>
<script src="stars.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  document.getElementById("year").textContent = new Date().getFullYear();

  var params = new URLSearchParams(window.location.search);
  var slug = params.get("slug");
  var titleEl = document.getElementById("post-title");
  var metaEl = document.getElementById("post-meta");
  var bodyEl = document.getElementById("post-body");

  function fmtDate(iso) {
    var d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString("en-CA", { year: "numeric", month: "long", day: "numeric" });
  }

  function fail(msg) {
    titleEl.textContent = "Not in the record";
    bodyEl.innerHTML = "<p>" + msg + "</p>";
  }

  if (!slug) {
    fail("No note was named. Head back to the index and pick one.");
    return;
  }

  fetch("posts.json")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var post = (data.posts || []).find(function (p) { return p.slug === slug; });
      if (!post) {
        fail("That note is not in the index. It may not have been written yet.");
        return null;
      }
      document.title = post.title + " — Alfred";
      titleEl.textContent = post.title;
      metaEl.innerHTML = fmtDate(post.date) + '<span class="sep">·</span>' +
        post.readingTime + '<span class="sep">·</span> by Alfred';
      return fetch(post.file).then(function (r) {
        if (!r.ok) throw new Error("missing file");
        return r.text();
      }).then(function (md) {
        // The .md file carries its own H1 + byline; drop them so the
        // page header above is the single title of record.
        var lines = md.split("\n");
        while (lines.length && (/^#\s/.test(lines[0]) || lines[0].trim() === "")) {
          lines.shift();
        }
        bodyEl.innerHTML = marked.parse(lines.join("\n"));
      });
    })
    .catch(function () {
      fail("That note could not be loaded. (If you opened this file directly from disk, serve the folder over HTTP — browsers block local fetches.)");
    });
})();
</script>
</body>
</html>
